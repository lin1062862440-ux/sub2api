[package]
name = "linai-windows-installer"
version = "0.1.3"
description = "LinAI Windows installer experience"
authors = ["LinAI"]
edition = "2021"
rust-version = "1.77.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
hex = "0.4"
sha2 = "0.10"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
dirs = "5.0"
fs2 = "0.4"
hex = "0.4"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-single-instance = "2.4.3"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"
