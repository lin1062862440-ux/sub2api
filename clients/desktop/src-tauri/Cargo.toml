[package]
name = "linai-desktop"
version = "0.1.7"
description = "LinAI desktop client"
authors = ["LinAI"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "linai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
sha2 = "0.10"
base64 = "0.22"
minisign-verify = "0.2.5"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-deep-link = "2.4.9"
tempfile = "3"
toml_edit = "0.22"
uuid = { version = "1.11", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.11.3", features = ["macos-private-api", "tray-icon"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAttributedString", "NSButton", "NSColor", "NSControl", "NSResponder", "NSStatusBarButton", "NSStatusItem", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSAttributedString", "NSDictionary", "NSObject", "NSString"] }
window-vibrancy = "0.6"

[dev-dependencies]
blake2 = "0.10"
ed25519-dalek = "2.2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
